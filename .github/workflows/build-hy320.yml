name: Build HY320 launcher APK

on:
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: "Build an installable release using the private GHSTROOT signing key"
        required: true
        type: boolean
        default: false
  push:
    branches: [main, hy320-mini]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HY320 package identity
        run: python -m unittest discover -s tests -p test_hy320_package_identity.py -v

      - name: Check shell script syntax
        run: bash -n launcher/build-and-install.sh tools/theme.sh

      - name: Build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug -PlauncherApplicationId=xyz.ghstroot.cleanyourtv.hy320mini

      - name: Mark artifact as CI-only
        run: |
          {
            echo "## Build-only artifact"
            echo
            echo "- This APK uses the temporary Android debug signing key generated on the GitHub Actions runner."
            echo "- Do not install it on the projector or use it as an update package."
            echo "- A persistent private release keystore and the final package identity must be configured before producing an installable APK."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-hy320-ci-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare private release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/ghstroot-hy320mini-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        working-directory: launcher
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PlauncherApplicationId=xyz.ghstroot.cleanyourtv.hy320mini

      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-hy320mini-signed-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: rm -f "$RUNNER_TEMP/ghstroot-hy320mini-release.p12"
