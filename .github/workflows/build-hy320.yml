name: Build HY320 launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main, hy320-mini]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PlauncherApplicationId=com.gathin.tvhome

      - name: Mark artifact as CI-only
        run: |
          {
            echo "## Build-only artifact"
            echo
            echo "- This APK uses the temporary Android debug signing key generated on the GitHub Actions runner."
            echo "- Do not install it on the projector or use it as an update package."
            echo "- A persistent private release keystore and the final package identity must be configured before producing an installable APK."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-hy320-ci-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
