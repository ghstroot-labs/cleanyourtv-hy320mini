name: Build HY320 launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PlauncherApplicationId=com.gathin.tvhome

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-hy320-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
